name: CI and Marketplace release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check, test and package
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Preserve LF line endings for formatting checks
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node <<'NODE'
          const { version } = require('./package.json');
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^\d+\.\d+\.\d+$/.test(version) || tag !== `v${version}`) {
            throw new Error(`Tag ${tag} must match the stable package.json version v${version}.`);
          }
          NODE
      - run: npm ci
      - run: npm run check
      - run: npx playwright install chromium
      - run: npm test
      - name: Package extension
        run: npx --yes @vscode/vsce@4.0.0 package --out codesnap-next.vsix
      - name: Upload VSIX
        uses: actions/upload-artifact@v6
        with:
          name: vsix-${{ github.sha }}
          path: codesnap-next.vsix
          if-no-files-found: error
      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore

  publish:
    name: Publish to VS Code Marketplace
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@v6
        with:
          name: vsix-${{ github.sha }}
      - name: Publish tested VSIX
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo '::error::Add the VSCE_PAT repository secret with Marketplace publishing permission.'
            exit 1
          fi
          npx --yes @vscode/vsce@4.0.0 publish --packagePath codesnap-next.vsix
